name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * *"  # daily, so a change on the internet (a feed format, YouTube) shows up even without commits
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, pipeline, server, page and instruction tests
        run: python -m unittest discover -s tests -v
        env:
          NEWSPAPER_REQUIRE_CHROME: "1"
          PYTHONUTF8: "1"

  live:
    runs-on: ubuntu-latest
    continue-on-error: true  # real feeds go down; this warns without blocking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Real feeds on the internet
        run: python -m unittest discover -s tests -p "test_live.py" -v
        env:
          NEWSPAPER_LIVE: "1"
          PYTHONUTF8: "1"
